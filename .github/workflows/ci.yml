name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies for thermion_dart
        # thermion_dart's native-asset build hook (packages/avatar_renderer's
        # transitive dep) compiles Filament's Linux/EGL backend with
        # `-stdlib=libc++` and links against EGL/GL/GBM/DRM. None of these
        # dev headers are on the default runner image, so `avatar_renderer`
        # (and anything depending on it, e.g. the app package) fails to
        # build its native asset before any Dart test even runs — first
        # with "'cstdint'/'chrono' file not found" (libc++), then with
        # "'EGL/egl.h' file not found" once libc++ is fixed. Installs both
        # sets up front rather than discovering them one compile error at a
        # time. libc++-dev is pinned to match the specific clang version
        # native_toolchain_c actually invokes (visible in the failure log as
        # /usr/lib/llvm-<N>/bin/clang, not whatever `clang` resolves to on
        # PATH), falling back to the unversioned package if that version
        # isn't available.
        run: |
          set -eu
          sudo apt-get update
          INSTALLED=""
          for d in /usr/lib/llvm-*; do
            [ -d "$d" ] || continue
            ver=$(basename "$d" | sed 's/llvm-//')
            if apt-cache show "libc++-${ver}-dev" >/dev/null 2>&1; then
              sudo apt-get install -y "libc++-${ver}-dev" "libc++abi-${ver}-dev"
              INSTALLED=1
            fi
          done
          if [ -z "$INSTALLED" ]; then
            sudo apt-get install -y libc++-dev libc++abi-dev
          fi
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test

  worker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker_dir:
          - workers/revenuecat-webhook
          - workers/web-profile
    defaults:
      run:
        working-directory: ${{ matrix.worker_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx --no-install tsc --noEmit
      - name: wrangler deploy dry-run (revenuecat-webhook)
        if: matrix.worker_dir == 'workers/revenuecat-webhook'
        run: npm run deploy:dry-run

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo clippy -- -D warnings

  # Expected red on main until owner-approved migration renames (#93). Does not gate flutter/worker/rust.
  supabase-migration-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit unique 14-digit migration version prefixes
        run: python3 scripts/ci/check_supabase_migration_versions.py

  # Full migration apply on Supabase-shaped Postgres (pgcrypto in extensions; search_path public only).
  # Expected red until duplicate versions are resolved; gen_random_bytes repair is in 20261122130000.
  supabase-migrations-apply:
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:17.4.1.068
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply full Supabase migration set
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash scripts/ci/apply_supabase_migrations.sh

  supabase-web-share-pgcrypto:
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:17.4.1.068
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Assert _web_share_new_token uses extensions.gen_random_bytes
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash scripts/ci/assert_web_share_pgcrypto_extensions.sh
