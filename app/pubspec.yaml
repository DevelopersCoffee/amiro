name: amiro_app
description: Amiro — your digital identity, made wearable.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.9.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.4
  identity_core:
    path: ../packages/identity_core
  avatar_core:
    path: ../packages/avatar_core
  avatar_renderer:
    path: ../packages/avatar_renderer
  # NOTE: no `thermion_flutter` here on purpose. The spec's global constraint
  # is that nothing outside `packages/avatar_renderer` imports it directly;
  # the app obtains a live renderer via `ThermionAvatarRenderer.create()`.

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
