name = "amiro-revenuecat-webhook"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Secrets (set with `wrangler secret put <NAME>`, not here):
#   WEBHOOK_PATH_TOKEN   random token that must match the URL path segment
#   CRASH_PATH_TOKEN     public URL gate for POST /crash/<token> (not a secret;
#                        compiled into the app via --dart-define). Rotate by
#                        deploying a new token and shipping a new app build.
#   SUPABASE_URL         e.g. https://srvhqmfjqmxxvrdctbtf.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY

[[ratelimits]]
binding = "CRASH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
