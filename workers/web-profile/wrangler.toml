name = "amiro-web-profile"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

# Deploy on id.amiro.app (custom domain route in Cloudflare dashboard).
# Secrets — dedicated to this Worker (do not reuse revenuecat-webhook values):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# Optional:
#   PLAY_STORE_URL
#
# PROFILE_RATE_LIMITER — required binding below (60 requests / minute per client IP).
# Returns 503 when the binding is missing so misconfigured deploys fail closed.

[[ratelimits]]
name = "PROFILE_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }